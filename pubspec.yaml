name: cannaguide
description: "CannaGuide — cannabis advisor and session journal with AI-powered strain recommendations."
publish_to: 'none'

version: 1.6.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # Storage
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4

  # State / Navigation
  provider: ^6.1.5
  go_router: ^14.8.1

  # Networking
  http: ^1.3.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2

  # Circles — QR invite
  qr_flutter: ^4.1.0

  # Notifications
  flutter_local_notifications: ^18.0.0

  # RevenueCat
  purchases_flutter: ^8.7.0

  # URL launching (Maps, links)
  url_launcher: ^6.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/cannaguide_backup.db
    - assets/cannaguide_logo.png
    - assets/mws_mark_dark.png
